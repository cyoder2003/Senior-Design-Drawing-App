<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Plotter Drawing</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 12px;
  }
  h1 { font-size: 1.1rem; margin: 4px 0 0; }
  .hint { margin: 0; font-size: 0.85rem; color: #555; }
  #pad {
    width: min(100%, 560px);
    aspect-ratio: 1 / 1;
    background: #fff;
    border: 2px solid #222;
    border-radius: 4px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: crosshair;
    display: block;
  }
  .row { display: flex; gap: 8px; width: min(100%, 560px); }
  button {
    flex: 1;
    padding: 14px 8px;
    font-size: 1rem;
    border: 2px solid #222;
    border-radius: 6px;
    background: #fff;
    color: #222;
  }
  button:active:not(:disabled) { background: #e6e6e6; }
  button:disabled { opacity: 0.4; }
  #submit { background: #222; color: #fff; }
  #submit:active:not(:disabled) { background: #444; }
  #status { min-height: 1.4em; margin: 0; font-size: 0.95rem; text-align: center; }
  #status.ok { color: #1a7f37; }
  #status.err { color: #c62828; }
</style>
</head>
<body>
<div class="app">
  <h1>Draw something for the plotter</h1>
  <p class="hint">Use one finger. The square is the drawing area.</p>
  <canvas id="pad"></canvas>
  <div class="row">
    <button id="undo" disabled>Undo</button>
    <button id="clear" disabled>Clear</button>
    <button id="submit" disabled>Submit</button>
  </div>
  <p id="status"></p>
</div>

<script>
// ---------------- Settings ----------------
const SUPABASE_URL = "https://azgqtxtweqiagektvwmm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ADAbV7_ZrRidQ5XIWRBJjQ_PnNjQWfI";

const BED_MM = 200;            // drawing area is BED_MM x BED_MM millimeters
const MIN_POINT_SPACING = 0.3; // mm; skip points closer than this
const MAX_SVG_CHARS = 200000;  // must match the limit in the database

// ---------------- State ----------------
const canvas = document.getElementById("pad");
const ctx = canvas.getContext("2d");
const undoBtn = document.getElementById("undo");
const clearBtn = document.getElementById("clear");
const submitBtn = document.getElementById("submit");
const statusEl = document.getElementById("status");

let strokes = [];        // each stroke is an array of {x, y} in mm
let current = null;      // stroke being drawn right now
let activePointer = null;
let submitting = false;

// ---------------- Canvas sizing ----------------
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  redraw();
}
window.addEventListener("resize", resizeCanvas);

// Convert a pointer event to millimeter coordinates on the bed
function toMM(e) {
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * BED_MM;
  const y = ((e.clientY - rect.top) / rect.height) * BED_MM;
  return {
    x: Math.min(BED_MM, Math.max(0, x)),
    y: Math.min(BED_MM, Math.max(0, y)),
  };
}

// ---------------- Drawing ----------------
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const scale = canvas.width / BED_MM;
  ctx.lineWidth = Math.max(2, 0.6 * scale);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#111";
  const all = current ? strokes.concat([current]) : strokes;
  for (const s of all) {
    if (s.length === 0) continue;
    ctx.beginPath();
    ctx.moveTo(s[0].x * scale, s[0].y * scale);
    if (s.length === 1) {
      ctx.lineTo(s[0].x * scale + 0.01, s[0].y * scale);
    }
    for (let i = 1; i < s.length; i++) {
      ctx.lineTo(s[i].x * scale, s[i].y * scale);
    }
    ctx.stroke();
  }
}

function addPoint(p) {
  const last = current[current.length - 1];
  if (last && Math.hypot(p.x - last.x, p.y - last.y) < MIN_POINT_SPACING) return;
  current.push(p);
}

canvas.addEventListener("pointerdown", (e) => {
  if (activePointer !== null || submitting) return;
  activePointer = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  current = [toMM(e)];
  setStatus("");
  redraw();
  e.preventDefault();
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerId !== activePointer || !current) return;
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (events.length ? events : [e])) addPoint(toMM(ev));
  redraw();
  e.preventDefault();
});

function endStroke(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  // A stroke needs at least 2 points to be something the plotter can draw
  if (current && current.length >= 2) strokes.push(current);
  current = null;
  redraw();
  updateButtons();
}
canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);

// ---------------- Buttons ----------------
function updateButtons() {
  const has = strokes.length > 0;
  undoBtn.disabled = !has || submitting;
  clearBtn.disabled = !has || submitting;
  submitBtn.disabled = !has || submitting;
}

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || "";
}

undoBtn.addEventListener("click", () => {
  strokes.pop();
  redraw();
  updateButtons();
  setStatus("");
});

clearBtn.addEventListener("click", () => {
  strokes = [];
  redraw();
  updateButtons();
  setStatus("");
});

// ---------------- SVG + submit ----------------
function buildSVG() {
  const round = (n) => Math.round(n * 100) / 100;
  const lines = strokes.map((s) => {
    const pts = s.map((p) => round(p.x) + "," + round(p.y)).join(" ");
    return '  <polyline points="' + pts + '" fill="none" stroke="black" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  return (
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + BED_MM + 'mm" height="' + BED_MM +
    'mm" viewBox="0 0 ' + BED_MM + " " + BED_MM + '">\n' +
    lines.join("\n") +
    "\n</svg>"
  );
}

submitBtn.addEventListener("click", async () => {
  if (submitting || strokes.length === 0) return;
  const svg = buildSVG();
  if (svg.length > MAX_SVG_CHARS) {
    setStatus("That drawing is too detailed to send. Try Undo or Clear and draw less.", "err");
    return;
  }

  submitting = true;
  updateButtons();
  setStatus("Sending...");

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/submissions", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal",
      },
      body: JSON.stringify({ svg: svg }),
    });
    if (!res.ok) {
      const text = await res.text();
      console.error("Submit failed:", res.status, text);
      throw new Error("Server said " + res.status);
    }
    strokes = [];
    redraw();
    setStatus("Sent! Your drawing is in the queue.", "ok");
  } catch (err) {
    console.error(err);
    setStatus("Could not send. Check your connection and try again.", "err");
  } finally {
    submitting = false;
    updateButtons();
  }
});

// ---------------- Start ----------------
resizeCanvas();
updateButtons();
</script>
</body>
</html>
