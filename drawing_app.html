<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<title>Plotter Draw</title>
<style>
  :root {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --ink: #17171a;
    --hover: #f0f0f3;
    --accent: #3e63dd;
    --shadow: 0 1px 2px rgba(16, 16, 24, 0.06), 0 10px 30px rgba(16, 16, 24, 0.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ---------- Layout ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .stage {
    grid-column: 2;
    grid-row: 1;
    container-type: size;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-width: 0;
    min-height: 0;
  }
  #pad {
    width: min(100cqw, 100cqh);
    height: auto;
    aspect-ratio: 1 / 1;
    display: block;
    background: #fff;
    border-radius: 14px;
    box-shadow: var(--shadow);
    touch-action: none;
    cursor: crosshair;
  }
  #pad[data-tool="text"] { cursor: text; }
  #pad[data-tool="eraser"] { cursor: none; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    grid-column: 1;
    grid-row: 1;
    align-self: center;
    margin: 12px 0 12px 12px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }
  .divider { width: 24px; height: 1px; background: rgba(0, 0, 0, 0.09); margin: 4px 0; }
  .tool {
    position: relative;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tool:hover { background: var(--hover); }
  .tool.active { background: var(--ink); color: #fff; }
  .tool:disabled { opacity: 0.3; cursor: default; background: transparent; }
  .tool.has-menu::after {
    content: "";
    position: absolute;
    right: 5px;
    bottom: 5px;
    border: 3px solid transparent;
    border-right-color: currentColor;
    border-bottom-color: currentColor;
    opacity: 0.45;
  }
  .dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.25);
  }

  /* ---------- Bottom bar ---------- */
  .bottombar {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex;
    justify-content: center;
    padding: 4px 12px 16px;
  }
  #submit {
    height: 52px;
    min-width: min(260px, 80vw);
    padding: 0 32px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    box-shadow: var(--shadow);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  #submit:active:not(:disabled) { transform: scale(0.98); }
  #submit:disabled { opacity: 0.3; cursor: default; }

  /* ---------- Popover ---------- */
  .popover {
    position: fixed;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .popover[hidden] { display: none; }
  .popover.shape { width: 192px; }
  .popover.color { width: 192px; gap: 0; }
  .opt {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .opt:hover { background: var(--hover); }
  .opt.sel { background: var(--ink); color: #fff; }
  .ring { display: block; border: 2px solid currentColor; border-radius: 50%; }
  .swatch {
    position: relative;
    width: 36px;
    height: 36px;
    margin: 4px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18);
    cursor: pointer;
    touch-action: manipulation;
  }
  .swatch.sel { box-shadow: 0 0 0 2.5px var(--ink); }
  .swatch.custom { background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .swatch.custom input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* ---------- Text entry ---------- */
  .textbar {
    position: fixed;
    z-index: 30;
    top: calc(env(safe-area-inset-top) + 10px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 6px 6px 16px;
    background: var(--surface);
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .textbar[hidden] { display: none; }
  .textbar input {
    width: min(52vw, 260px);
    border: 0;
    outline: 0;
    background: transparent;
    font-family: inherit;
    font-size: 16px;
    text-transform: uppercase;
    color: var(--ink);
    -webkit-user-select: text;
    user-select: text;
  }
  .textbar button {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: var(--hover);
    color: var(--ink);
    touch-action: manipulation;
  }
  .textbar button.go { background: var(--ink); color: #fff; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    z-index: 40;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 84px);
    transform: translate(-50%, 8px);
    max-width: 90vw;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #b42318; }
  .toast.ok { background: #1a7f37; }

  /* ---------- Short screens (phone in landscape) ---------- */
  @media (max-height: 480px) {
    .toolbar { margin: 8px 0 8px 8px; padding: 6px; gap: 2px; }
    .tool { width: 38px; height: 38px; }
    .dot { width: 20px; height: 20px; }
    .stage { padding: 8px; }
    .bottombar { padding: 2px 12px 8px; }
    #submit { height: 44px; }
    .toast { bottom: calc(env(safe-area-inset-bottom) + 64px); }
  }
</style>
</head>

// ============================================================
// Geometry helpers

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

function toMM(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: clamp(((e.clientX - rect.left) / rect.width) * BED_MM, 0, BED_MM),
    y: clamp(((e.clientY - rect.top) / rect.height) * BED_MM, 0, BED_MM),
  };
}

function distToSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  let t = len2 === 0 ? 0 : ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
  t = clamp(t, 0, 1);
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

// Insert points so no gap between neighbors exceeds maxStep
function densify(pts, maxStep) {
  if (pts.length === 0) return [];
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / maxStep);
    for (let k = 1; k <= n; k++) {
      out.push({ x: a.x + ((b.x - a.x) * k) / n, y: a.y + ((b.y - a.y) * k) / n });
    }
  }
  return out;
}

// Ramer-Douglas-Peucker: drop points that sit within eps of a straight line
function simplify(pts, eps) {
  if (pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length);
  keep[0] = 1;
  keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [s, e] = stack.pop();
    let maxD = 0, idx = -1;
    for (let i = s + 1; i < e; i++) {
      const d = distToSeg(pts[i], pts[s], pts[e]);
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (idx !== -1 && maxD > eps) {
      keep[idx] = 1;
      stack.push([s, idx], [idx, e]);
    }
  }
  return pts.filter((_, i) => keep[i]);
}

// ============================================================
// Shapes (defined in a unit square, then stretched to the drag box)
// ============================================================
function normalize(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) {
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const w = (x1 - x0) || 1, h = (y1 - y0) || 1;
  return pts.map(([x, y]) => [(x - x0) / w, (y - y0) / h]);
}

function starPoints(n, inner) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 === 0 ? 1 : inner;
    const a = -Math.PI / 2 + (i * Math.PI) / n;
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  pts.push(pts[0]);
  return normalize(pts);
}

  } else if (key === "rectangle") {
    polys = [[[0, 0], [1, 0], [1, 1], [0, 1], [0, 0]]];
  } else if (key === "ellipse") {
    const p = [];
    for (let i = 0; i <= 96; i++) {
      const t = (i / 96) * Math.PI * 2;
      p.push([0.5 + 0.5 * Math.cos(t), 0.5 + 0.5 * Math.sin(t)]);
    }
    polys = [p];
  } else if (key === "triangle") {
    polys = [[[0.5, 0], [1, 1], [0, 1], [0.5, 0]]];
  } else if (key === "star") {
    polys = [starPoints(5, 0.382)];
  } else if (key === "star12") {
    polys = [starPoints(12, 0.72)];
  } else if (key === "heart") {
    const p = [];
    for (let i = 0; i <= 120; i++) {
      const t = (i / 120) * Math.PI * 2;
      p.push([
        16 * Math.pow(Math.sin(t), 3),
        -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)),
      ]);
    }
    polys = [normalize(p)];
  }
  unitCache[key] = polys;
  return polys;
}

function shapeIcon(key) {
  const parts = unitShape(key).map((poly) =>
    '<polyline points="' + poly.map(([u, v]) => (3 + u * 18).toFixed(2) + "," + (3 + v * 18).toFixed(2)).join(" ") + '"/>'
  ).join("");
  return svgIcon(parts);
}

function buildShape(key, a, b) {
  if (key === "line") return [{ c: penColor, p: densify([a, b], 1) }];
  const x0 = Math.min(a.x, b.x), y0 = Math.min(a.y, b.y);
  const w = Math.abs(a.x - b.x), h = Math.abs(a.y - b.y);
  return unitShape(key).map((poly) => ({
    c: penColor,
    p: densify(poly.map(([u, v]) => ({ x: x0 + u * w, y: y0 + v * h })), 1),
  }));
}

// ============================================================
// Text -> strokes
// ============================================================
function textWidthMM(text, size) {
  let u = 0;
  for (const ch of text) {
    if (ch === " ") u += SPACE_ADVANCE;
    else if (FONT[ch]) u += FONT[ch][0] + LETTER_GAP;
  }
  if (text && text[text.length - 1] !== " ") u -= LETTER_GAP;
  return (u * size) / 6;
}

function textLayout(d) {
  const unit = d.size / 6;
  const wmm = textWidthMM(d.text, d.size);
  return {
    unit, wmm,
    x0: Math.max(0, Math.min(d.x, BED_MM - wmm)),
    y0: Math.max(0, Math.min(d.y, BED_MM - d.size * 1.3)),
  };
}

function textStrokes(d) {
  const L = textLayout(d);
  const out = [];
  let cx = 0;
  for (const ch of d.text) {
    if (ch === " ") { cx += SPACE_ADVANCE; continue; }
    const g = FONT[ch];
    if (!g) continue;
    for (const flat of g[1]) {
      const p = [];
      for (let i = 0; i < flat.length; i += 2) {
        p.push({ x: L.x0 + (cx + flat[i]) * L.unit, y: L.y0 + flat[i + 1] * L.unit });
      }
      out.push({ c: penColor, p });
    }
    cx += g[0] + LETTER_GAP;
  }
  return out;
}

// ============================================================
// Drawing
// ============================================================
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  redraw();
}

function drawStroke(s) {
  if (!s.p.length) return;
  const scale = canvas.width / BED_MM;
  ctx.strokeStyle = s.c;
  ctx.beginPath();
  ctx.moveTo(s.p[0].x * scale, s.p[0].y * scale);
  if (s.p.length === 1) ctx.lineTo(s.p[0].x * scale + 0.01, s.p[0].y * scale);
  for (let i = 1; i < s.p.length; i++) ctx.lineTo(s.p[i].x * scale, s.p[i].y * scale);
  ctx.stroke();
}

function redraw() {
  const dpr = window.devicePixelRatio || 1;
  const scale = canvas.width / BED_MM;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = Math.max(1.6 * dpr, 0.8 * scale);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (const s of strokes) drawStroke(s);
  if (currentStroke) drawStroke(currentStroke);
  if (shapeDrag) for (const s of buildShape(shapeKey, shapeDrag.a, shapeDrag.b)) drawStroke(s);

  if (draft) {
    for (const s of textStrokes(draft)) drawStroke(s);
    if (caretOn) {
      const L = textLayout(draft);
      const cx = (L.x0 + L.wmm + (draft.text ? L.unit * 0.8 : 0)) * scale;
      ctx.strokeStyle = "#3e63dd";
      ctx.lineWidth = 1.5 * dpr;
      ctx.beginPath();
      ctx.moveTo(cx, L.y0 * scale);
      ctx.lineTo(cx, (L.y0 + draft.size) * scale);
      ctx.stroke();
    }
  }

  if (tool === "eraser" && hover) {
    ctx.beginPath();
    ctx.arc(hover.x * scale, hover.y * scale, ERASER_RADIUS[eraserSize] * scale, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
    ctx.fill();
    ctx.strokeStyle = "rgba(23, 23, 26, 0.55)";
    ctx.lineWidth = 1.5 * dpr;
    ctx.stroke();
  }
}

// ============================================================
// History
// ============================================================
function commit() {
  history.push(JSON.stringify(strokes));
  if (history.length > 100) history.shift();
  updateButtons();
}

function undo() {
  if (draft) { cancelText(); return; }
  if (history.length <= 1) return;
  history.pop();
  strokes = JSON.parse(history[history.length - 1]);
  redraw();
  updateButtons();
}

function updateButtons() {
  const hasDraftText = !!(draft && draft.text.trim());
  undoBtn.disabled = history.length <= 1 && !draft;
  submitBtn.disabled = submitting || (strokes.length === 0 && !hasDraftText);
}

// ============================================================
// Eraser (splits strokes so only the touched part disappears)
// ============================================================
function strokeNearSegment(pts, a, b, r) {
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const p of pts) {
    if (p.x < minx) minx = p.x; if (p.x > maxx) maxx = p.x;
    if (p.y < miny) miny = p.y; if (p.y > maxy) maxy = p.y;
  }
  return !(
    maxx < Math.min(a.x, b.x) - r || minx > Math.max(a.x, b.x) + r ||
    maxy < Math.min(a.y, b.y) - r || miny > Math.max(a.y, b.y) + r
  );
}

function eraseSegment(a, b) {
  const r = ERASER_RADIUS[eraserSize];
  let changed = false;
  const next = [];
  for (const s of strokes) {
    if (!strokeNearSegment(s.p, a, b, r)) { next.push(s); continue; }
    const dense = densify(s.p, 0.5);
    let hit = false;
    for (const p of dense) { if (distToSeg(p, a, b) <= r) { hit = true; break; } }
    if (!hit) { next.push(s); continue; }
    changed = true;
    let cur = [];
    for (const p of dense) {
      if (distToSeg(p, a, b) <= r) {
        if (cur.length >= 2) next.push({ c: s.c, p: cur });
        cur = [];
      } else {
        cur.push(p);
      }
    }
    if (cur.length >= 2) next.push({ c: s.c, p: cur });
  }
  strokes = next;
  return changed;
}

// ============================================================
// Pointer input
// ============================================================
canvas.addEventListener("pointerdown", (e) => {
  if (tool === "text") return;            // text is placed on click
  if (activePointer !== null || submitting) return;
  activePointer = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  const p = toMM(e);

  if (tool === "pencil") {
    currentStroke = { c: penColor, p: [p] };
  } else if (tool === "eraser") {
    hover = p;
    eraseLast = p;
    eraseChanged = eraseSegment(p, p);
  } else if (tool === "shape") {
    shapeDrag = { a: p, b: p };
  }
  redraw();
  e.preventDefault();
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerId !== activePointer) {
    if (tool === "eraser" && e.pointerType === "mouse") { hover = toMM(e); redraw(); }
    return;
  }
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (events.length ? events : [e])) {
    const p = toMM(ev);
    if (tool === "pencil" && currentStroke) {
      const last = currentStroke.p[currentStroke.p.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) >= MIN_POINT_SPACING) currentStroke.p.push(p);
    } else if (tool === "eraser") {
      hover = p;
      if (eraseSegment(eraseLast, p)) eraseChanged = true;
      eraseLast = p;
    } else if (tool === "shape" && shapeDrag) {
      shapeDrag.b = p;
    }
  }
  redraw();
  e.preventDefault();
});

function endPointer(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;

  if (tool === "pencil" && currentStroke) {
    if (currentStroke.p.length >= 2) { strokes.push(currentStroke); commit(); }
    currentStroke = null;
  } else if (tool === "eraser") {
    if (eraseChanged) commit();
    eraseChanged = false;
    eraseLast = null;
    if (e.pointerType !== "mouse") hover = null;
  } else if (tool === "shape" && shapeDrag) {
    const { a, b } = shapeDrag;
    if (Math.hypot(b.x - a.x, b.y - a.y) >= 3) {
      for (const s of buildShape(shapeKey, a, b)) strokes.push(s);
      commit();
    }
    shapeDrag = null;
  }
  redraw();
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", () => {
  if (activePointer === null && hover) { hover = null; redraw(); }
});

// ============================================================
// Text tool
// ============================================================
canvas.addEventListener("click", (e) => {
  if (tool !== "text" || submitting) return;
  startText(toMM(e));
});

function startText(p) {
  commitText();
  draft = { x: p.x, y: p.y, size: TEXT_HEIGHT[textSize], text: "" };
  textInput.value = "";
  textbar.hidden = false;
  textInput.focus();
  caretOn = true;
  clearInterval(caretTimer);
  caretTimer = setInterval(() => { caretOn = !caretOn; redraw(); }, 530);
  redraw();
  updateButtons();
}

function endDraft() {
  draft = null;
  clearInterval(caretTimer);
  caretTimer = null;
  textbar.hidden = true;
  textInput.blur();
}

function commitText() {
  if (!draft) return;
  const d = { ...draft, text: draft.text.replace(/\s+$/, "") };
  endDraft();
  if (d.text) {
    for (const s of textStrokes(d)) strokes.push(s);
    commit();
  }
  redraw();
  updateButtons();
}

function cancelText() {
  if (!draft) return;
  endDraft();
  redraw();
  updateButtons();
}

textInput.addEventListener("input", () => {
  if (!draft) return;
  let v = textInput.value.toUpperCase().split("").filter((ch) => ch === " " || FONT[ch]).join("");
  if (textWidthMM(v, draft.size) > BED_MM) v = draft.text;   // refuse text wider than the bed
  textInput.value = v;
  draft.text = v;
  caretOn = true;
  redraw();
  updateButtons();
});
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); commitText(); }
  else if (e.key === "Escape") { e.preventDefault(); cancelText(); }
});
textInput.addEventListener("blur", () => { if (!textbarPress) commitText(); });

textbar.addEventListener("pointerdown", () => {
  textbarPress = true;
  setTimeout(() => { textbarPress = false; }, 400);
});
textbar.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
document.getElementById("textDone").addEventListener("click", commitText);
document.getElementById("textCancel").addEventListener("click", cancelText);

// ============================================================
// Toolbar and popovers
// ============================================================
function refreshToolUI() {
  for (const b of toolbar.querySelectorAll(".tool")) {
    const a = b.dataset.action;
    b.classList.toggle("active", a === tool);
  }
  canvas.dataset.tool = tool;
  shapeBtn.innerHTML = shapeIcon(shapeKey);
  hover = null;
  redraw();
}

function closePopover() {
  popover.hidden = true;
  popoverKind = null;
}

function openPopover(kind, anchor) {
  popoverKind = kind;
  popover.className = "popover " + kind;
  let html = "";
  if (kind === "shape") {
    html = SHAPE_KEYS.map((k) =>
      '<button class="opt' + (k === shapeKey && tool === "shape" ? " sel" : "") + '" data-shape="' + k +
      '" title="' + SHAPE_LABELS[k] + '" aria-label="' + SHAPE_LABELS[k] + '">' + shapeIcon(k) + "</button>"
    ).join("");
  } else if (kind === "eraser") {
    const diam = { s: 10, m: 16, l: 24 };
    html = ["s", "m", "l"].map((k) =>
      '<button class="opt' + (k === eraserSize ? " sel" : "") + '" data-eraser="' + k +
      '" aria-label="Eraser size ' + k.toUpperCase() + '"><span class="ring" style="width:' + diam[k] + "px;height:" + diam[k] + 'px"></span></button>'
    ).join("");
  } else if (kind === "text") {
    const fs = { s: 13, m: 18, l: 24 };
    html = ["s", "m", "l"].map((k) =>
      '<button class="opt' + (k === textSize ? " sel" : "") + '" data-textsize="' + k +
      '" aria-label="Text size ' + k.toUpperCase() + '"><span style="font-size:' + fs[k] + 'px;font-weight:700;line-height:1">A</span></button>'
    ).join("");
  } else if (kind === "color") {
    html = COLORS.map((c) =>
      '<button class="swatch' + (c === penColor ? " sel" : "") + '" data-color="' + c +
      '" style="background:' + c + '" aria-label="Color ' + c + '"></button>'
    ).join("") +
      '<label class="swatch custom" title="Custom color"><input type="color" id="customColor" value="' + penColor + '" aria-label="Custom color"></label>';
  }
  popover.innerHTML = html;
  popover.hidden = false;

  const a = anchor.getBoundingClientRect();
  const t = toolbar.getBoundingClientRect();
  const h = popover.offsetHeight;
  popover.style.left = t.right + 10 + "px";
  popover.style.top = clamp(a.top + a.height / 2 - h / 2, 8, window.innerHeight - h - 8) + "px";
}

function setColor(c) {
  penColor = c;
  colorDot.style.background = c;
  redraw();
}

toolbar.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
popover.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });

toolbar.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-action]");
  if (!b || b.disabled) return;
  const a = b.dataset.action;

  if (a === "undo") { undo(); return; }
  if (a === "color") {
    if (popoverKind === "color") closePopover(); else openPopover("color", b);
    return;
  }

  commitText();   // switching tools finishes any text in progress
  if (a === "shape") {
    tool = "shape";
    refreshToolUI();
    if (popoverKind === "shape") closePopover(); else openPopover("shape", b);
    return;
  }
  const wasActive = tool === a;
  tool = a;
  refreshToolUI();
  if ((a === "eraser" || a === "text") && wasActive) {
    if (popoverKind === a) closePopover(); else openPopover(a, b);
  } else {
    closePopover();
  }
});

popover.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.shape) {
    commitText();
    shapeKey = b.dataset.shape;
    tool = "shape";
    refreshToolUI();
    closePopover();
  } else if (b.dataset.eraser) {
    eraserSize = b.dataset.eraser;
    closePopover();
  } else if (b.dataset.textsize) {
    textSize = b.dataset.textsize;
    closePopover();
  } else if (b.dataset.color) {
    setColor(b.dataset.color);
    closePopover();
  }
});
popover.addEventListener("input", (e) => {
  if (e.target.id === "customColor") setColor(e.target.value);
});

document.addEventListener("pointerdown", (e) => {
  if (!popover.hidden && !popover.contains(e.target) && !toolbar.contains(e.target)) closePopover();
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && document.activeElement !== textInput) {
    e.preventDefault();
    undo();
  } else if (e.key === "Escape") {
    closePopover();
  }
});

// ============================================================
// Submit
// ============================================================
function toast(msg, kind) {
  toastEl.textContent = msg;
  toastEl.className = "toast show " + (kind || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), kind === "err" ? 4500 : 3000);
}

function buildSVG() {
  const round = (n) => Math.round(n * 100) / 100;
  const lines = [];
  for (const s of strokes) {
    const pts = simplify(s.p, 0.05);
    if (pts.length < 2) continue;
    lines.push(
      '  <polyline points="' + pts.map((p) => round(p.x) + "," + round(p.y)).join(" ") +
      '" fill="none" stroke="' + s.c + '" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>'
    );
  }
  if (lines.length === 0) return null;
  return (
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + BED_MM + 'mm" height="' + BED_MM +
    'mm" viewBox="0 0 ' + BED_MM + " " + BED_MM + '">\n' + lines.join("\n") + "\n</svg>"
  );
}

submitBtn.addEventListener("click", async () => {
  if (submitting) return;
  commitText();
  const svg = buildSVG();
  if (!svg) return;
  if (svg.length > MAX_SVG_CHARS) {
    toast("Too detailed to send. Undo a few strokes and try again.", "err");
    return;
  }

  submitting = true;
  submitBtn.textContent = "Sending...";
  updateButtons();

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/submissions", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal",
      },
      body: JSON.stringify({ svg: svg }),
    });
    if (!res.ok) {
      console.error("Submit failed:", res.status, await res.text());
      throw new Error("Server said " + res.status);
    }
    strokes = [];
    history = ["[]"];
    redraw();
    toast("Sent! Your design is in the queue.", "ok");
  } catch (err) {
    console.error(err);
    toast("Could not send. Check your connection and try again.", "err");
  } finally {
    submitting = false;
    submitBtn.textContent = "Submit design";
    updateButtons();
  }
});

// ============================================================
// Start
// ============================================================
toolbar.querySelector('[data-action="pencil"]').innerHTML = ICONS.pencil;
toolbar.querySelector('[data-action="eraser"]').innerHTML = ICONS.eraser;
toolbar.querySelector('[data-action="text"]').innerHTML = ICONS.text;
undoBtn.innerHTML = ICONS.undo;
document.getElementById("textCancel").innerHTML = ICONS.close;
document.getElementById("textDone").innerHTML = ICONS.check;
colorDot.style.background = penColor;

new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize", () => { closePopover(); resizeCanvas(); });
refreshToolUI();
resizeCanvas();
updateButtons();
</script>
</body>
</html>
