<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<title>Plotter Draw</title>
<style>
  :root {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --ink: #17171a;
    --hover: #f0f0f3;
    --accent: #3e63dd;
    --shadow: 0 1px 2px rgba(16, 16, 24, 0.06), 0 10px 30px rgba(16, 16, 24, 0.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ---------- Layout ---------- */
  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .stage {
    grid-column: 2;
    grid-row: 1;
    container-type: size;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-width: 0;
    min-height: 0;
  }
  #pad {
    width: min(100cqw, 100cqh);
    height: auto;
    aspect-ratio: 1 / 1;
    display: block;
    background: #fff;
    border-radius: 14px;
    box-shadow: var(--shadow);
    touch-action: none;
    cursor: crosshair;
  }
  #pad[data-tool="text"] { cursor: text; }
  #pad[data-tool="eraser"] { cursor: none; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    grid-column: 1;
    grid-row: 1;
    align-self: center;
    margin: 12px 0 12px 12px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }
  .toolbar { width: 60px; }
  .tool { width: 44px; height: 44px; }
  @media (max-width: 560px) {
    .toolbar { width: 50px; margin-left: 6px; padding: 4px; }
    .tool { width: 38px; height: 38px; }
    .stage { padding: 8px 5px; }
    .textbar { gap: 3px; padding-left: 8px; }
    .textbar input { width: 32vw; }
    .textbar select { max-width: 86px; }
  }
  .divider { width: 24px; height: 1px; background: rgba(0, 0, 0, 0.09); margin: 4px 0; }
  .tool {
    position: relative;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tool:hover { background: var(--hover); }
  .tool.active { background: var(--ink); color: #fff; }
  .tool:disabled { opacity: 0.3; cursor: default; background: transparent; }
  .tool.has-menu::after {
    content: "";
    position: absolute;
    right: 5px;
    bottom: 5px;
    border: 3px solid transparent;
    border-right-color: currentColor;
    border-bottom-color: currentColor;
    opacity: 0.45;
  }
  .dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.25);
  }

  /* ---------- Bottom bar ---------- */
  .bottombar {
    grid-column: 1 / -1;
    grid-row: 2;
    display: flex;
    justify-content: center;
    padding: 4px 12px 16px;
  }
  #submit {
    height: 52px;
    min-width: min(260px, 80vw);
    padding: 0 32px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    box-shadow: var(--shadow);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  #submit:active:not(:disabled) { transform: scale(0.98); }
  #submit:disabled { opacity: 0.3; cursor: default; }

  /* ---------- Popover ---------- */
  .popover {
    position: fixed;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .popover[hidden] { display: none; }
  .popover.shape { width: 156px; }
  .popover.color { width: 192px; gap: 0; }
  .opt {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .opt:hover { background: var(--hover); }
  .opt.sel { background: var(--ink); color: #fff; }
  .ring { display: block; border: 2px solid currentColor; border-radius: 50%; }
  .swatch {
    position: relative;
    width: 36px;
    height: 36px;
    margin: 4px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.18);
    cursor: pointer;
    touch-action: manipulation;
  }
  .swatch.sel { box-shadow: 0 0 0 2.5px var(--ink); }
  .swatch.custom { background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .swatch.custom input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* ---------- Text entry ---------- */
  .textbar {
    position: fixed;
    z-index: 30;
    top: calc(env(safe-area-inset-top) + 10px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 6px 6px 16px;
    background: var(--surface);
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .textbar[hidden] { display: none; }
  .textbar input {
    width: min(52vw, 260px);
    border: 0;
    outline: 0;
    background: transparent;
    font-family: inherit;
    font-size: 16px;
    text-transform: none;
    color: var(--ink);
    -webkit-user-select: text;
    user-select: text;
  }
  .textbar select { max-width: 120px; border: 0; border-radius: 18px; padding: 8px 22px 8px 10px; background: var(--hover); color: var(--ink); font-family: inherit; font-size: 13px; }
  .textbar button {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: var(--hover);
    color: var(--ink);
    touch-action: manipulation;
  }
  .textbar button.go { background: var(--ink); color: #fff; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    z-index: 40;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 84px);
    transform: translate(-50%, 8px);
    max-width: 90vw;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #b42318; }
  .toast.ok { background: #1a7f37; }

  /* ---------- Short screens (phone in landscape) ---------- */
  @media (max-height: 480px) {
    .toolbar { margin: 8px 0 8px 8px; padding: 6px; gap: 2px; }
    .tool { width: 38px; height: 38px; }
    .dot { width: 20px; height: 20px; }
    .stage { padding: 8px; }
    .bottombar { padding: 2px 12px 8px; }
    #submit { height: 44px; }
    .toast { bottom: calc(env(safe-area-inset-bottom) + 64px); }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="toolbar" id="toolbar" aria-label="Tools">
    <button class="tool" data-action="select" title="Select and transform" aria-label="Select and transform"></button>
    <button class="tool" data-action="pencil" title="Pencil" aria-label="Pencil"></button>
    <button class="tool has-menu" data-action="eraser" title="Eraser" aria-label="Eraser"></button>
    <button class="tool" data-action="line" title="Line" aria-label="Line"></button>
    <button class="tool has-menu" data-action="shape" title="Shapes" aria-label="Shapes"></button>
    <button class="tool has-menu" data-action="text" title="Text" aria-label="Text"></button>
    <div class="divider"></div>
    <button class="tool has-menu" data-action="color" title="Color" aria-label="Color"><span class="dot" id="colorDot"></span></button>
    <div class="divider"></div>
    <button class="tool" data-action="undo" id="undo" title="Undo" aria-label="Undo" disabled></button>
    <button class="tool" data-action="clear" id="clear" title="Clear canvas" aria-label="Clear canvas"></button>
  </aside>

  <main class="stage">
    <canvas id="pad" data-tool="pencil"></canvas>
  </main>

  <footer class="bottombar">
    <button id="submit" disabled>Submit design</button>
  </footer>
</div>

<div class="popover" id="popover" hidden></div>

<div class="textbar" id="textbar" hidden>
  <select id="fontSelect" aria-label="Text font"><option value="Print">Print</option><option value="Cursive">Cursive</option></select>
  <input id="textInput" type="text" maxlength="60" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Type text" aria-label="Text to add">
  <button type="button" id="textCancel" aria-label="Cancel text"></button>
  <button type="button" id="textDone" class="go" aria-label="Add text"></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

  const magnitude=Math.abs(value),tolerance=Math.max(magnitude,reference)*0.03;

}

function toMM(e) {

function distToSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  let t = len2 === 0 ? 0 : ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
  t = clamp(t, 0, 1);
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));

  if(Math.abs(dy)/len<tolerance) return {x:point.x,y:anchor.y};
  if(Math.abs(dx)/len<tolerance) return {x:anchor.x,y:point.y};

function densify(pts, maxStep) {

    const a = pts[i - 1], b = pts[i];

function simplify(pts, eps) {
  if (pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length);
  keep[0] = 1;
  keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [s, e] = stack.pop();
    let maxD = 0, idx = -1;

// Drawing
// ============================================================
function resizeCanvas() {

  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));

  ctx.moveTo(s.p[0].x * scale, s.p[0].y * scale);

  ctx.lineWidth = Math.max(1.6 * dpr, 0.8 * scale);
  ctx.lineCap = "round";

  for (const s of strokes) {

  }
  if (currentStroke) drawStroke(currentStroke);
  if (shapeDrag) for (const s of buildShape(tool === "line" ? "line" : shapeKey, shapeDrag.a, shapeDrag.b)) drawStroke(s);

  if (draft) {

  if(selectionMarquee) {
    const x=Math.min(selectionMarquee.start.x,selectionMarquee.current.x)*scale;
    const y=Math.min(selectionMarquee.start.y,selectionMarquee.current.y)*scale;
    const w=Math.abs(selectionMarquee.current.x-selectionMarquee.start.x)*scale;

// ============================================================
// History
// ============================================================
function commit() {
  history.push(JSON.stringify(strokes));
  if (history.length > 100) history.shift();
  updateButtons();
}

function undo() {
  if (draft) { cancelText(); return; }
  if (history.length <= 1) return;
  history.pop();
  strokes = JSON.parse(history[history.length - 1]);
  selectedGroup=null; selectedGroups=[]; rememberSelectionFrame([]); selectionMarquee=null;
  redraw();
  updateButtons();
}

function updateButtons() {
  const hasDraftText = !!(draft && draft.text.trim());
  undoBtn.disabled = history.length <= 1 && !draft;
  submitBtn.disabled = submitting || (strokes.length === 0 && !hasDraftText);
}

// ============================================================
// Eraser (splits strokes so only the touched part disappears)
// ============================================================

    maxx < Math.min(a.x, b.x) - r || minx > Math.max(a.x, b.x) + r ||
    maxy < Math.min(a.y, b.y) - r || miny > Math.max(a.y, b.y) + r

      const hit = a.x >= s.x-s.w/2-r && a.x <= s.x+s.w/2+r && a.y >= s.y-s.h/2-r && a.y <= s.y+s.h/2+r;

    }
    if (!strokeNearSegment(s.p, a, b, r)) { next.push(s); continue; }
    const dense = densify(s.p, 0.5);
    let hit = false;
    for (const p of dense) { if (distToSeg(p, a, b) <= r) { hit = true; break; } }
    if (!hit) { next.push(s); continue; }
    changed = true;
    let cur = [];
    for (const p of dense) {
      if (distToSeg(p, a, b) <= r) {
        if (cur.length >= 2) next.push({ c: s.c, p: cur });
        cur = [];
      } else {
        cur.push(p);

    if (cur.length >= 2) next.push({ c: s.c, p: cur });

    if(ids.length===1&&frame.shapeKey==="line") {
      const line=original.find(s=>s.p),first=line.p[0],last=line.p[line.p.length-1];
      const d0=Math.hypot((p.x-first.x)*scalePt,(p.y-first.y)*scalePt),d1=Math.hypot((p.x-last.x)*scalePt,(p.y-last.y)*scalePt);
      const len=Math.hypot((last.x-first.x)*scalePt,(last.y-first.y)*scalePt),radius=Math.min(18*(window.devicePixelRatio||1),len*.32);
      const endpoint=Math.min(d0,d1)<=radius?(d0<=d1?0:line.p.length-1):null;
      transformDrag={id:ids[0],ids,groupFrames,mode:endpoint===null?"move":"lineEndpoint",endpoint,start:p,frame,center:{x:frame.cx,y:frame.cy},moved:false,original};
      redraw();e.preventDefault();return;
    }
    const cornerIndex=corners.findIndex(q=>near(p,q));
    const dx=p.x-frame.cx,dy=p.y-frame.cy,a=-(frame.angle||0),lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
    const tolerance=22*(window.devicePixelRatio||1)/scalePt;
    const hitX=Math.abs(Math.abs(lx)-frame.w/2)<=tolerance&&Math.abs(ly)<=frame.h/2+tolerance;
    const hitY=Math.abs(Math.abs(ly)-frame.h/2)<=tolerance&&Math.abs(lx)<=frame.w/2+tolerance;
    const cornerSigns=[[-1,-1],[1,-1],[1,1],[-1,1]];
    const signs=cornerIndex>=0?cornerSigns[cornerIndex]:[Math.sign(lx)||1,Math.sign(ly)||1];
    const mode=cornerIndex>=0||(hitX&&hitY)?"cornerScale":hitX?"scaleX":hitY?"scaleY":"move";
    const sideX=mode==="scaleX"?(Math.sign(lx)||1):signs[0],sideY=mode==="scaleY"?(Math.sign(ly)||1):signs[1];
    transformDrag={id:ids[0],ids,groupFrames,mode,start:p,frame,center:{x:frame.cx,y:frame.cy},angle:Math.atan2(p.y-frame.cy,p.x-frame.cx),sideX,sideY,moved:false,original};
    redraw();e.preventDefault();return;
  }

  if (tool === "pencil") {
    currentStroke = { c: penColor, p: [p] };
  } else if (tool === "eraser") {
    hover = p;
    eraseLast = p;
    eraseChanged = eraseSegment(p, p);
  } else if (tool === "shape" || tool === "line") {
    shapeDrag = { a: p, b: p };
  }
  redraw();
  e.preventDefault();
});

canvas.addEventListener("pointermove", (e) => {
  if (e.pointerId !== activePointer) {
    if (tool === "eraser" && e.pointerType === "mouse") { hover = toMM(e); redraw(); }
    return;
  }
  const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (events.length ? events : [e])) {
    const p = toMM(ev);
    if (tool === "pencil" && currentStroke) {
      const last = currentStroke.p[currentStroke.p.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) >= MIN_POINT_SPACING) currentStroke.p.push(p);
    } else if (tool === "eraser") {
      hover = p;
      if (eraseSegment(eraseLast, p)) eraseChanged = true;
      eraseLast = p;
    } else if ((tool === "shape" || tool === "line") && shapeDrag) {
      const dx=p.x-shapeDrag.a.x,dy=p.y-shapeDrag.a.y, size=Math.max(Math.abs(dx),Math.abs(dy));
      if(tool==="line") shapeDrag.b=snapLineEndpoint(shapeDrag.a,p);
      else if(Math.abs(Math.abs(dx)-Math.abs(dy))<size*0.03) shapeDrag.b={x:shapeDrag.a.x+Math.sign(dx||1)*size,y:shapeDrag.a.y+Math.sign(dy||1)*size};
      else shapeDrag.b=p;
    } else if(tool==="select" && selectionMarquee) {
      selectionMarquee.current=p;
      if(Math.hypot(p.x-selectionMarquee.start.x,p.y-selectionMarquee.start.y)>.7) selectionMarquee.moved=true;
    } else if (tool === "select" && transformDrag) {
      const t=transformDrag, f=t.frame, c=t.center;
      if(Math.hypot(p.x-t.start.x,p.y-t.start.y)>0.7) t.moved=true;
      // Restore the original object before applying the current gesture delta.
      const saved=t.original;
      const targetIds=t.ids||[t.id];
      strokes=strokes.filter(s=>!targetIds.includes(s.gid)).concat(saved.map(s=>JSON.parse(JSON.stringify(s))));
      if(!t.moved) continue;
      const mode=t.mode,moveX=p.x-t.start.x,moveY=p.y-t.start.y,next={...f};
      if(mode==="lineEndpoint") {
        const line=strokes.find(s=>s.gid===t.id&&s.p),source=t.original.find(s=>s.p);
        if(line&&source) {
          const fixed=t.endpoint===0?source.p[source.p.length-1]:source.p[0],moving=snapLineEndpoint(fixed,p);
          line.p=densify(t.endpoint===0?[moving,fixed]:[fixed,moving],1);
          const a=line.p[0],b=line.p[line.p.length-1],x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
          next.cx=(x0+x1)/2;next.cy=(y0+y1)/2;next.w=Math.max(.1,x1-x0);next.h=Math.max(.1,y1-y0);next.angle=0;next.shapeKey="line";
          line.frame={...next};rememberSelectionFrame(targetIds,next);
        }
        continue;
      } else if(mode==="move") {
        next.cx=clamp(f.cx+moveX,0,BED_MM);next.cy=clamp(f.cy+moveY,0,BED_MM);
      } else if(mode==="scaleX"||mode==="scaleY") {
        const a=-(f.angle||0),dx=p.x-c.x,dy=p.y-c.y,sx0=t.start.x-c.x,sy0=t.start.y-c.y;
        const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
        const sxStart=sx0*Math.cos(a)-sy0*Math.sin(a),syStart=sx0*Math.sin(a)+sy0*Math.cos(a);
        const rotate=(x,y)=>({x:c.x+x*Math.cos(f.angle||0)-y*Math.sin(f.angle||0),y:c.y+x*Math.sin(f.angle||0)+y*Math.cos(f.angle||0)});
        if(mode==="scaleX") {
          const signed=snapSignedDimension(f.w+t.sideX*(lx-sxStart),f.h),opposite=-t.sideX*f.w/2,edge=opposite+t.sideX*signed;
          const shift=rotate((edge+opposite)/2,0);next.w=Math.max(.01,Math.abs(signed));next.flipX=(!!f.flipX)!==(signed<0);next.cx=shift.x;next.cy=shift.y;
        } else {
          const signed=snapSignedDimension(f.h+t.sideY*(ly-syStart),f.w),opposite=-t.sideY*f.h/2,edge=opposite+t.sideY*signed;
          const shift=rotate(0,(edge+opposite)/2);next.h=Math.max(.01,Math.abs(signed));next.flipY=(!!f.flipY)!==(signed<0);next.cx=shift.x;next.cy=shift.y;
        }
      } else if(mode==="cornerScale") {
        const radius=Math.hypot(t.start.x-c.x,t.start.y-c.y);
        const signedFactor=((p.x-c.x)*(t.start.x-c.x)+(p.y-c.y)*(t.start.y-c.y))/Math.max(.01,radius*radius);
        const factor=Math.max(.01,Math.abs(signedFactor));
        next.w=Math.max(.1,f.w*factor);next.h=Math.max(.1,f.h*factor);
        next.angle=(f.angle||0)+Math.atan2(p.y-c.y,p.x-c.x)-t.angle;
        const upright=Math.round(next.angle/(Math.PI/2))*(Math.PI/2);
        if(Math.abs(next.angle-upright)<.02) next.angle=upright;
        if(signedFactor<0){next.flipX=!f.flipX;next.flipY=!f.flipY;}
      }
      transformSelection(targetIds,f,next,t.groupFrames);rememberSelectionFrame(targetIds,next);
    }
  }
  redraw();
  e.preventDefault();
});

function endPointer(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;

  if (tool === "pencil" && currentStroke) {
    if (currentStroke.p.length >= 2) {
      currentStroke.p=smoothStroke(currentStroke.p);
      const xs=currentStroke.p.map(p=>p.x),ys=currentStroke.p.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
      currentStroke.gid=nextGroup++;
      currentStroke.frame={cx:(x0+x1)/2,cy:(y0+y1)/2,w:Math.max(.1,x1-x0),h:Math.max(.1,y1-y0),angle:0,shapeKey:"freehand"};
      strokes.push(currentStroke); commit();
    }
    currentStroke = null;
  } else if (tool === "eraser") {
    if (eraseChanged) commit();
    eraseChanged = false;
    eraseLast = null;
    if (e.pointerType !== "mouse") hover = null;
  } else if ((tool === "shape" || tool === "line") && shapeDrag) {
    const { a, b } = shapeDrag;
    if (Math.hypot(b.x - a.x, b.y - a.y) >= 3) {
      const gid=nextGroup++;
      const key=tool==="line"?"line":shapeKey;
      const frame={cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,w:Math.max(Math.abs(b.x-a.x),0.1),h:Math.max(Math.abs(b.y-a.y),0.1),angle:0,shapeKey:key,anchors:shapeAnchorLocals(key)};
      if(key==="triangle") frame.vertices=frameAnchors(frame);
      for (const s of buildShape(key, a, b)) { s.gid=gid; s.frame={...frame}; strokes.push(s); }
      commit();
    }
    shapeDrag = null;
  } else if(tool==="select" && selectionMarquee) {
    const marquee=selectionMarquee;
    marquee.current=toMM(e);
    if(Math.hypot(marquee.current.x-marquee.start.x,marquee.current.y-marquee.start.y)>.7) marquee.moved=true;
    selectionMarquee=null;
    if(marquee.moved) {
      selectedGroups=groupsWithinRect(marquee.start,marquee.current);
      selectedGroup=selectedGroups.length===1?selectedGroups[0]:null;
      rememberSelectionFrame(selectedGroups,selectedGroups.length===1?groupFrame(selectedGroups[0]):selectionBoundsFrame(selectedGroups));
    }
  } else if (tool === "select" && transformDrag) {
    const t=transformDrag;
    transformDrag=null;
    if(t.moved) commit();
    else if(e.type==="pointerup" && (t.ids||[t.id]).length===1 && t.mode==="move") {
      const text=strokes.find(s=>s.gid===t.id && s.kind==="text");
      if(text) startText({x:text.x,y:text.y},text);
    }
  }
  redraw();
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", () => {
  if (activePointer === null && hover) { hover = null; redraw(); }
});

// ============================================================
// Text tool
// ============================================================
canvas.addEventListener("click", (e) => {
  if (tool !== "text" || submitting) return;
  startText(toMM(e));
});

function startText(p, existing=null) {
  commitText();
  draft = existing
    ? {x:existing.x,y:existing.y,size:existing.size||existing.h,text:existing.text,font:existing.font,c:existing.c,w:existing.w,h:existing.h,rotation:existing.rotation||0,flipX:!!existing.flipX,flipY:!!existing.flipY,gid:existing.gid}
    : { x: p.x, y: p.y, size: TEXT_HEIGHT[textSize], text: "", font:fontFamily, c:penColor, rotation:0,flipX:false,flipY:false };
  fontFamily=draft.font;
  document.getElementById("fontSelect").value=fontFamily;
  textInput.value = draft.text;
  textbar.hidden = false;
  textInput.focus();
  redraw();
  updateButtons();
}

function endDraft() {
  draft = null;
  textbar.hidden = true;
  textInput.blur();
}

function commitText() {
  if (!draft) return;
  const d = { ...draft, text: draft.text.replace(/\s+$/, "") };
  endDraft();
  if (d.gid) strokes=strokes.filter(s=>s.gid!==d.gid);
  if (d.text) {
    const metrics=measureTextFrame(d.text,d.font,d.size,d.x,d.y,d.rotation||0,d.w,d.h,d.flipX,d.flipY);
    const gid=d.gid||nextGroup++, rotation=d.rotation||0;
    strokes.push({kind:"text",gid,text:d.text,font:d.font,c:d.c,x:metrics.cx,y:metrics.cy,w:metrics.w,h:metrics.h,size:d.size,rotation,flipX:!!d.flipX,flipY:!!d.flipY,frame:{...metrics.frame,flipX:!!d.flipX,flipY:!!d.flipY}});
    commit();
  } else if(d.gid) {
    commit();
  }
  redraw();
  updateButtons();
}

function cancelText() {
  if (!draft) return;
  endDraft();
  redraw();
  updateButtons();
}

textInput.addEventListener("input", () => {
  if (!draft) return;
  let v = textInput.value.replace(/[\u0000-\u001f\u007f]/g, "");
  const tooWide=textWidthMM(v,draft.size,draft.font)>BED_MM;
  if (tooWide) v = draft.text;
  textInput.value = v;
  draft.text = v;
  if(draft.gid) { draft.w=null; draft.h=null; }
  redraw();
  updateButtons();
});
document.getElementById("fontSelect").addEventListener("change", (e) => { fontFamily=e.target.value; if(draft) { draft.font=fontFamily; if(draft.gid) {draft.w=null;draft.h=null;} redraw(); } });
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); commitText(); }
  else if (e.key === "Escape") { e.preventDefault(); cancelText(); }
});
textInput.addEventListener("blur", () => { if (!textbarPress) commitText(); });

textbar.addEventListener("pointerdown", () => {
  textbarPress = true;
  setTimeout(() => { textbarPress = false; }, 400);
});
textbar.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
document.getElementById("textDone").addEventListener("click", commitText);
document.getElementById("textCancel").addEventListener("click", cancelText);

// ============================================================
// Toolbar and popovers
// ============================================================
function refreshToolUI() {
  for (const b of toolbar.querySelectorAll(".tool")) {
    const a = b.dataset.action;
    b.classList.toggle("active", a === tool);
  }
  canvas.dataset.tool = tool;
  if (tool !== "select") { selectedGroup = null; selectedGroups=[]; rememberSelectionFrame([]); selectionMarquee=null; }
  shapeBtn.innerHTML = shapeIcon(shapeKey);
  hover = null;
  redraw();
}

function closePopover() {
  popover.hidden = true;
  popoverKind = null;
}

function openPopover(kind, anchor) {
  popoverKind = kind;
  popover.className = "popover " + kind;
  let html = "";
  if (kind === "shape") {
    html = SHAPE_KEYS.map((k) =>
      '<button class="opt' + (k === shapeKey && tool === "shape" ? " sel" : "") + '" data-shape="' + k +
      '" title="' + SHAPE_LABELS[k] + '" aria-label="' + SHAPE_LABELS[k] + '">' + shapeIcon(k) + "</button>"
    ).join("");
  } else if (kind === "eraser") {
    const diam = { s: 10, m: 18, l: 32 };
    html = ["s", "m", "l"].map((k) =>
      '<button class="opt' + (k === eraserSize ? " sel" : "") + '" data-eraser="' + k +
      '" aria-label="Eraser size ' + k.toUpperCase() + '"><span class="ring" style="width:' + diam[k] + "px;height:" + diam[k] + 'px"></span></button>'
    ).join("");
  } else if (kind === "text") {
    const fs = { s: 13, m: 18, l: 24 };
    html = ["s", "m", "l"].map((k) =>
      '<button class="opt' + (k === textSize ? " sel" : "") + '" data-textsize="' + k +
      '" aria-label="Text size ' + k.toUpperCase() + '"><span style="font-size:' + fs[k] + 'px;font-weight:700;line-height:1">A</span></button>'
    ).join("");
  } else if (kind === "color") {
    html = COLORS.map((c) =>
      '<button class="swatch' + (c === penColor ? " sel" : "") + '" data-color="' + c +
      '" style="background:' + c + '" aria-label="Color ' + c + '"></button>'
    ).join("") +
      '<label class="swatch custom" title="Custom color"><input type="color" id="customColor" value="' + penColor + '" aria-label="Custom color"></label>';
  }
  popover.innerHTML = html;
  popover.hidden = false;

  const a = anchor.getBoundingClientRect();
  const t = toolbar.getBoundingClientRect();
  const h = popover.offsetHeight;
  popover.style.left = t.right + 10 + "px";
  popover.style.top = clamp(a.top + a.height / 2 - h / 2, 8, window.innerHeight - h - 8) + "px";
}

function setColor(c) {
  penColor = c;
  colorDot.style.background = c;
  redraw();
}

toolbar.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });
popover.addEventListener("mousedown", (e) => { if (e.target.closest("button")) e.preventDefault(); });

toolbar.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-action]");
  if (!b || b.disabled) return;
  const a = b.dataset.action;

  if (a === "undo") { undo(); return; }
  if (a === "clear") {
    commitText();
    if (strokes.length) { strokes=[]; selectedGroup=null; selectedGroups=[]; rememberSelectionFrame([]); selectionMarquee=null; commit(); redraw(); }
    closePopover(); return;
  }
  if (a === "color") {
    if (popoverKind === "color") closePopover(); else openPopover("color", b);
    return;
  }

  commitText();   // switching tools finishes any text in progress
  if (a === "shape") {
    tool = "shape";
    refreshToolUI();
    if (popoverKind === "shape") closePopover(); else openPopover("shape", b);
    return;
  }
  const wasActive = tool === a;
  tool = a;
  refreshToolUI();
  if ((a === "eraser" || a === "text") && wasActive) {
    if (popoverKind === a) closePopover(); else openPopover(a, b);
  } else {
    closePopover();
  }
});

popover.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.shape) {
    commitText();
    shapeKey = b.dataset.shape;
    tool = "shape";
    refreshToolUI();
    closePopover();
  } else if (b.dataset.eraser) {
    eraserSize = b.dataset.eraser;
    closePopover();
  } else if (b.dataset.textsize) {
    textSize = b.dataset.textsize;
    closePopover();
  } else if (b.dataset.color) {
    setColor(b.dataset.color);
    closePopover();
  }
});
popover.addEventListener("input", (e) => {
  if (e.target.id === "customColor") setColor(e.target.value);
});

document.addEventListener("pointerdown", (e) => {
  if (!popover.hidden && !popover.contains(e.target) && !toolbar.contains(e.target)) closePopover();
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && document.activeElement !== textInput) {
    e.preventDefault();
    undo();
  } else if (e.key === "Escape") {
    closePopover();
  }
});

// ============================================================
// Submit
// ============================================================
function toast(msg, kind) {
  toastEl.textContent = msg;
  toastEl.className = "toast show " + (kind || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), kind === "err" ? 4500 : 3000);
}

function buildSVG() {
  const round = (n) => Math.round(n * 100) / 100;
  const lines = [];
  for (const s of strokes) {
    const source=s.kind==="text"?textStrokes(s):[s];
    for(const stroke of source) {
      const pts=simplify(stroke.p,0.05);
      if(pts.length<2) continue;
      lines.push('  <polyline points="'+pts.map((p)=>round(p.x)+","+round(p.y)).join(" ")+ '" fill="none" stroke="'+stroke.c+'" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>');
    }
  }
  if (lines.length === 0) return null;
  return (
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + BED_MM + 'mm" height="' + BED_MM +
    'mm" viewBox="0 0 ' + BED_MM + " " + BED_MM + '">\n' + lines.join("\n") + "\n</svg>"
  );
}

submitBtn.addEventListener("click", async () => {
  if (submitting) return;
  commitText();
  const svg = buildSVG();
  if (!svg) return;
  if (svg.length > MAX_SVG_CHARS) {
    toast("Too detailed to send. Undo a few strokes and try again.", "err");
    return;
  }

  submitting = true;
  submitBtn.textContent = "Sending...";
  updateButtons();

  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/submissions", {
      method: "POST",
      headers: {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal",
      },
      body: JSON.stringify({ svg: svg }),
    });
    if (!res.ok) {
      console.error("Submit failed:", res.status, await res.text());
      throw new Error("Server said " + res.status);
    }
    strokes = [];
    history = ["[]"];
    redraw();
    toast("Sent! Your design is in the queue.", "ok");
  } catch (err) {
    console.error(err);
    toast("Could not send. Check your connection and try again.", "err");
  } finally {
    submitting = false;
    submitBtn.textContent = "Submit design";
    updateButtons();
  }
});

// ============================================================
// Start
// ============================================================
toolbar.querySelector('[data-action="pencil"]').innerHTML = ICONS.pencil;
toolbar.querySelector('[data-action="select"]').innerHTML = ICONS.select;
toolbar.querySelector('[data-action="line"]').innerHTML = ICONS.line;
toolbar.querySelector('[data-action="eraser"]').innerHTML = ICONS.eraser;
toolbar.querySelector('[data-action="text"]').innerHTML = ICONS.text;
undoBtn.innerHTML = ICONS.undo;
document.getElementById("clear").innerHTML = ICONS.clear;
document.getElementById("textCancel").innerHTML = ICONS.close;
document.getElementById("textDone").innerHTML = ICONS.check;
colorDot.style.background = penColor;

new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize", () => { closePopover(); resizeCanvas(); });
refreshToolUI();
resizeCanvas();
updateButtons();
</script>
</body>
</html>
